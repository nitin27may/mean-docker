title: MEAN Stack with Docker
description: A full-stack TypeScript contact manager on the MEAN stack - MongoDB, Express, Angular 22 and Node - containerised with Docker and fronted by Nginx.
remote_theme: just-the-docs/just-the-docs

lang: en-US

plugins:
  # Keeps the old /local-devlopment.html URL working after the spelling fix.
  - jekyll-redirect-from
  - jekyll-seo-tag

# `url` is the origin ONLY. The project path lives in `baseurl`.
# Putting the path in `url` doubles it into every canonical/og:url that
# jekyll-seo-tag emits (https://nitinksingh.com/mean-docker/mean-docker/...),
# which is how every page on this site ended up canonicalised to a 404.
url: https://nitinksingh.com
baseurl: /mean-docker

# Social / structured-data identity used by jekyll-seo-tag.
author:
  name: Nitin Singh
twitter:
  username: nitin27may
  card: summary_large_image

# Give every page an og:image unless it overrides `image` itself.
defaults:
  - scope:
      path: ""
    values:
      image: /screenshots/architecture.png

# Enable support for hyphenated search keywords
search_tokenizer_separator: /[\s/]+/

# Aux links for the upper right navigation
aux_links:
  "View on GitHub":
    - "//github.com/nitin27may/mean-docker"
  # This site had no link out of it anywhere -- not to the blog it is published
  # under, not to its sibling doc sites. This one is the only project site Google
  # has actually indexed, off an older crawl, so the equity it does carry was
  # going nowhere. The three siblings below need it more than it does.
  "nitinksingh.com":
    - "/"

# Footer content
# Site-wide footer. Identical on all four doc sites by design, so the family
# reads as one property rather than four unrelated microsites. It lives in the
# footer rather than only in aux_links/nav because the footer renders on EVERY
# page, while aux_links reads as chrome and is easy to miss.
#
# Raw HTML is safe here: the theme interpolates this value without escaping
# (verified against live output -- `&copy;` arrives as an entity, not
# `&amp;copy;`).
#
# Each site links to itself as well as its siblings. That is deliberate: it is
# what keeps the string byte-identical across all four repos, so the footer can
# be copied between them without a per-site diff to reconcile.
#
# NOTE: an earlier revision carried a per-repo TOPICAL deep link here (e.g. the
# Clean Architecture series for that repo), which carries more ranking signal
# than a homepage link. That is incompatible with a uniform footer and was
# dropped on purpose. If those are wanted back, nav_external_links is the place
# -- it is already per-site, so it can differ without breaking this.
footer_content: >-
  &copy; 2026 <a href="https://nitinksingh.com/">Nitin Singh</a> &middot; MIT License
  &middot; <a href="https://nitinksingh.com/ai-resources/">AI Knowledge Hub</a>
  &middot; <a href="https://nitinksingh.com/e-commerce-agents/">E-Commerce Agents</a>
  &middot; <a href="https://nitinksingh.com/clean-architecture-docker-dotnet-angular/">Clean Architecture</a>
  &middot; <a href="https://nitinksingh.com/mean-docker/">MEAN Stack</a>

# Color scheme supports "light" (default) and "dark"
color_scheme: light

# Add spacing to fix title cropping issue
heading_anchors: true

# Fixed spacing configuration
callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    color: blue
  new:
    color: green
  note:
    color: purple
  warning:
    color: red

# Set the proper spacing (this is the correct format)
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
  
# Add custom CSS for spacing
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/nitin27may/mean-docker"
gh_edit_branch: "master"
gh_edit_view_mode: "tree"

# Enable navigation structure
nav_external_links:
  - title: MEAN Stack Contacts on GitHub
    url: https://github.com/nitin27may/mean-docker
    hide_icon: false
  # The sibling doc sites, all published under the same domain. Trailing slashes
  # are required: GitHub Pages 301s the unslashed form of a directory index.
  - title: AI Knowledge Hub
    url: https://nitinksingh.com/ai-resources/
    hide_icon: false
  - title: E-Commerce Agents
    url: https://nitinksingh.com/e-commerce-agents/
    hide_icon: false
  - title: Clean Architecture Starter
    url: https://nitinksingh.com/clean-architecture-docker-dotnet-angular/
    hide_icon: false

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Enable collapsible navigation
collapse_inactive_chapters: true

# Enable copy code button
enable_copy_code_button: true
# Google Analytics Tracking (optional)
ga_tracking: G-5Z8HS51RCP
ga_tracking_anonymize_ip: true

