# Badge name is load-bearing: README.md links to "Nginx Build".
name: Nginx Build

on:
  push:
    branches: [master]
    paths:
      - 'loadbalancer/**'
      - '.github/workflows/nginx-build-and-push.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# Rapid pushes supersede each other instead of each paying for a full build.
concurrency:
  group: nginx-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Forks have no Docker Hub credentials; without this every fork burns its
    # own Actions minutes on a build that can only fail at the login step.
    if: github.repository == 'nitin27may/mean-docker'
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: mean-nginx
      context: loadbalancer
    secrets: inherit
