apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mean
  labels:
    io.kompose.service: database
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: database
    spec:
      containers:
        - name: mean-mongo
          # Pinned to the 9.0 major, not a Rapid Release: 8.2 went end of life in
          # July 2026, between maintenance passes. 8.0 is out too: it refuses to start
          # on Linux kernel 6.19+ (SERVER-121912). A data volume created by 8.2 will
          # not open under 9.0 — see CHANGELOG 3.0.0 (`down -v` and reseed).
          image: mongo:9.0
          env:
            - name: MONGO_DB
              value: mean-contacts
            - name: MONGO_INITDB_DATABASE
              value: mean-contacts
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-password
            - name: MONGO_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-username
            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-password
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d/
              name: database-claim1
            - mountPath: /data/db
              name: database-claim2
      restartPolicy: Always
      volumes:
        - name: database-claim1
          persistentVolumeClaim:
            claimName: database-claim1
        - name: database-claim2
          persistentVolumeClaim:
            claimName: database-claim2
