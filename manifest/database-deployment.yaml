apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mean
  labels:
    io.kompose.service: database
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: database
    spec:
      containers:
        - name: mean-mongo
          # 8.2, not 8.0: MongoDB 8.0 refuses to start on Linux kernel 6.19+
          # (SERVER-121912), which rules it out on current node images.
          image: mongo:8.2
          env:
            - name: MONGO_DB
              value: mean-contacts
            - name: MONGO_INITDB_DATABASE
              value: mean-contacts
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-password
            - name: MONGO_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-username
            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-password
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d/
              name: database-claim1
            - mountPath: /data/db
              name: database-claim2
      restartPolicy: Always
      volumes:
        - name: database-claim1
          persistentVolumeClaim:
            claimName: database-claim1
        - name: database-claim2
          persistentVolumeClaim:
            claimName: database-claim2
