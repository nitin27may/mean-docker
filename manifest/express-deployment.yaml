apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mean
  labels:
    io.kompose.service: express
  name: express
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: express
  template:
    metadata:
      labels:
        io.kompose.service: express
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mean-express
          image: nitin27may/mean-expressjs:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: MONGO_DB_DATABASE
              value: mean-contacts
            - name: MONGO_DB_HOST
              value: database
            - name: MONGO_DB_PORT
              value: "27017"
            - name: MONGO_DB_PARAMETERS
              value: ?authSource=admin
            - name: MONGO_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-username
            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: mongo-password
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: mean-secrets
                  key: jwt-secret
          ports:
            # The API listens on 3000; this said 4100, which matched nothing.
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
