# Copy to manifest/secret.yaml and fill in real values before applying.
# secret.yaml is gitignored — credentials do not belong in this repository.
#
#   cp manifest/secret.example.yaml manifest/secret.yaml
#   openssl rand -base64 48          # value for jwt-secret
#
# For anything beyond a local cluster, source these from a real secret store
# (Azure Key Vault, AWS Secrets Manager, Sealed Secrets) rather than a file.
apiVersion: v1
kind: Secret
metadata:
  name: mean-secrets
  namespace: mean
type: Opaque
stringData:
  # Must be at least 32 characters — the API refuses to start otherwise.
  jwt-secret: replace-me-with-openssl-rand-base64-48
  mongo-username: dbuser
  mongo-password: replace-me
